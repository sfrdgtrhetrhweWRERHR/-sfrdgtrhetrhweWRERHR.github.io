<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mengxuehu</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --card: #fffdf8;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #a23e48;
      --border: #e6ded0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, #efe3d0 0, transparent 35%),
        linear-gradient(160deg, var(--bg), #f9f7f2 55%, #efe8dc);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
    }

    main {
      width: min(92vw, 680px);
      padding: 40px 36px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(31, 41, 51, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .label {
      margin-top: 28px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
    }

    .email {
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(162, 62, 72, 0.3);
    }

    a:hover {
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Mengxuehu</h1>
    <p>This page is a public contact page for identity verification.</p>
    <div class="label">Email</div>
    <div class="email">
      <a href="mailto:mollyhmx@gamil.com">mollyhmx@gamil.com</a>
    </div>
  </main>
</body>
</html>
